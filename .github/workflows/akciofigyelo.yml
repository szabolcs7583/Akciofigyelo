name: Akciofigyelo

on:
  workflow_dispatch:
  schedule:
     - cron: '17 * * * *'

permissions:
  contents: write

jobs:
  figyeles:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Kod letoltese
        uses: actions/checkout@v4

      - name: Python telepitese
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Fuggosegek telepitese
        run: pip install -r requirements.txt

      - name: Akciok ellenorzese
        env:
          MAIL_FROM: ${{ secrets.MAIL_FROM }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
          MAIL_APP_PASSWORD: ${{ secrets.MAIL_APP_PASSWORD }}
        run: python run_cloud.py

      - name: Eredmenyek mentese
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Akciofigyelo adatok frissitese"
            git push
          fi
